<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <MAIN>
  <div class="card">

    <p>Entre com sua conta para continuar</p>
    
    <form>
      <!-- Campo EMail -->
      <div class="field">
        <label>E-mail</label>
          <input
            type="email"
            placeholder="seu@email.com">
      </div>
      <!-- Campo PassWord -->
      <div class="field">
        <label>Senha</label>
          <input 
            type="password"
            placeholder="digite sua senha">
      </div>
      <button class="btn" type="submit">Entrar</button>
    </form>
    <p class="foot">Não tem conta?
      <a href="#">Cadastre-se</a>
    </p>
  </div>
    </MAIN>
</body>
</html>
